name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # The e2e suites run in one process (--runInBand) and each one boots the
    # whole app, so memory grows with every suite. At 62 suites the default
    # heap (about 2 GB) ran out and Node crashed (exit 134). 4 GB fits the
    # runner. No test changes: only the memory limit.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend project
        id: detect
        run: |
          if [ -f backend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No backend/package.json yet, skipping backend checks."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm run lint
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm run typecheck
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm run build
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: npm test -- --runInBand
      - name: E2E tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/travel-planning
        run: npm run test:e2e -- --runInBand

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet, skipping frontend checks."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
